spring:
  application:
    name: payment-system

  config:
    import: optional:file:.env[.properties]

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/paymentsys_db}
    username: ${DB_USERNAME:paymentsys_user}
    password: ${DB_PASSWORD:paymentsys_pass}
    hikari:
      maximum-pool-size: 35
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms

server:
  port: 8080

transfer:
  zombie-cleanup:
    enabled: true
    interval-ms: 600000     # sweep every 10 minutes
    stale-after-ms: 300000  # INITIATED older than 5 minutes is a zombie
  stream:
    enabled: true
    key: transfers:pending
    dlq-key: transfers:dlq
    group: transfer-workers
    consumer: ${HOSTNAME:worker-1}
    redis:
      host: ${QUEUE_REDIS_HOST:localhost}
      port: ${QUEUE_REDIS_PORT:6380}
      timeout: 5s
    executor:
      core-pool-size: 8
      max-pool-size: 12
      queue-capacity: 500

report:
  stream:
    enabled: true
    key: reports:pending
    dlq-key: reports:dlq
    group: report-workers
    consumer: ${HOSTNAME:report-worker-1}
    executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 500

resilience4j:
  circuitbreaker:
    instances:
      transferExecution:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        ignoreExceptions:
          - com.example.payment_system.exception.PaymentException
      reportExecution:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        ignoreExceptions:
          - com.example.payment_system.exception.PaymentException
  bulkhead:
    instances:
      transferExecution:
        maxConcurrentCalls: 10
        maxWaitDuration: 500ms
      reportExecution:
        maxConcurrentCalls: 4
        maxWaitDuration: 500ms

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-prod-at-least-32-bytes-long-secret-key}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  security:
    disabled: ${SECURITY_DISABLED:false}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    bootstrap-admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      name: ${ADMIN_NAME:System Admin}
      email: ${ADMIN_EMAIL:admin@paymentsys.local}
      password: ${ADMIN_PASSWORD:admin12345}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}

cache:
  enabled: ${CACHE_ENABLED:true}
  user:
    ttl-seconds: 300
  account:
    ttl-seconds: 300
    notify:
      enabled: true
  report:
    past-ttl-seconds: 3600
    completed-ttl-seconds: 300
