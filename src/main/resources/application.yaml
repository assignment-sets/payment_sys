spring:
  application:
    name: payment-system

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/paymentsys_db}
    username: ${DB_USERNAME:paymentsys_user}
    password: ${DB_PASSWORD:paymentsys_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms

server:
  port: 8080

transfer:
  zombie-cleanup:
    enabled: true
    interval-ms: 600000     # sweep every 10 minutes
    stale-after-ms: 300000  # INITIATED older than 5 minutes is a zombie