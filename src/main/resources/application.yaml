spring:
  application:
    name: payment-system

  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: payments_user
    password: payments_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

transfer:
  zombie-cleanup:
    enabled: true
    interval-ms: 600000     # sweep every 10 minutes
    stale-after-ms: 300000  # INITIATED older than 5 minutes is a zombie