services:
  postgres:
    image: postgres:13-alpine
    container_name: payment-postgres
    restart: "no"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: paymentsys_db
      POSTGRES_USER: paymentsys_user
      POSTGRES_PASSWORD: paymentsys_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentsys_user -d paymentsys_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: payment-redis
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-queue:
    image: redis:7-alpine
    container_name: payment-redis-queue
    restart: "no"
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  redis_queue_data:
