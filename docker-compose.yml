services:
  postgres:
    image: postgres:13-alpine
    container_name: payment-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: paymentsys_db
      POSTGRES_USER: paymentsys_user
      POSTGRES_PASSWORD: paymentsys_pass
    volumes:
      - payments_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentsys_user -d paymentsys_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payments_pgdata:
